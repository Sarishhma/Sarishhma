<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="240" height="240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bob   { animation: bob 3s ease-in-out infinite; }
    .eye   { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    .earL  { transform-box: fill-box; transform-origin: 50% 100%; animation: wiggleL 5s ease-in-out infinite; }
    .earR  { transform-box: fill-box; transform-origin: 50% 100%; animation: wiggleR 5s ease-in-out infinite; }
    .heart { transform-box: fill-box; transform-origin: center; animation: float 3s ease-in infinite; }
    .h2    { animation-delay: 1.5s; }
    @keyframes bob    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes blink  { 0%,90%,100% { transform: scaleY(1); } 94% { transform: scaleY(0.08); } }
    @keyframes wiggleL{ 0%,70%,100% { transform: rotate(0); } 78% { transform: rotate(-8deg); } 86% { transform: rotate(3deg); } }
    @keyframes wiggleR{ 0%,70%,100% { transform: rotate(0); } 78% { transform: rotate(8deg); } 86% { transform: rotate(-3deg); } }
    @keyframes float  { 0% { transform: translateY(0) scale(.5); opacity: 0; }
                        30% { opacity: 1; }
                        100% { transform: translateY(-45px) scale(1); opacity: 0; } }
  </style>

  <!-- floating hearts -->
  <g transform="translate(245,105)"><g class="heart"><path d="M0 0 C-8 -10 -22 0 0 18 C22 0 8 -10 0 0 Z" fill="#FF8FB1"/></g></g>
  <g transform="translate(55,120)"><g class="heart h2"><path d="M0 0 C-6 -8 -17 0 0 14 C17 0 6 -8 0 0 Z" fill="#C9A7FF"/></g></g>

  <g class="bob" stroke="#3B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- ears -->
    <g class="earL">
      <ellipse cx="112" cy="72" rx="20" ry="52" fill="#fff"/>
      <ellipse cx="112" cy="76" rx="9" ry="34" fill="#FFC9DA" stroke="none"/>
    </g>
    <g class="earR">
      <ellipse cx="188" cy="72" rx="20" ry="52" fill="#fff"/>
      <ellipse cx="188" cy="76" rx="9" ry="34" fill="#FFC9DA" stroke="none"/>
    </g>
    <!-- body -->
    <ellipse cx="150" cy="238" rx="68" ry="52" fill="#fff"/>
    <!-- paws -->
    <ellipse cx="124" cy="274" rx="17" ry="11" fill="#fff"/>
    <ellipse cx="176" cy="274" rx="17" ry="11" fill="#fff"/>
    <!-- head -->
    <ellipse cx="150" cy="155" rx="80" ry="68" fill="#fff"/>
    <!-- cheeks -->
    <ellipse cx="97" cy="174" rx="14" ry="9" fill="#FFB3CB" stroke="none"/>
    <ellipse cx="203" cy="174" rx="14" ry="9" fill="#FFB3CB" stroke="none"/>
    <!-- eyes -->
    <g class="eye">
      <ellipse cx="120" cy="155" rx="8" ry="10" fill="#3B2F4A" stroke="none"/>
      <circle cx="123" cy="151" r="3" fill="#fff" stroke="none"/>
    </g>
    <g class="eye">
      <ellipse cx="180" cy="155" rx="8" ry="10" fill="#3B2F4A" stroke="none"/>
      <circle cx="183" cy="151" r="3" fill="#fff" stroke="none"/>
    </g>
    <!-- nose + mouth -->
    <ellipse cx="150" cy="170" rx="6" ry="4.5" fill="#FF8FB1" stroke-width="2"/>
    <path d="M150 175 Q143 184 136 178 M150 175 Q157 184 164 178" fill="none" stroke-width="2.5"/>
  </g>
</svg>
